# Phikon-v2 + ABMIL on cleaned COAD vs READ cohort (single-model protocol).
# Differences vs phikon_abmil.yaml: clean manifest, GradTail class weights in loss,
# instance dropout on bags, optional early stopping on AUC via CLI --early-metric auc.

dataset:
  dataset_root: data/raw_wsi
  manifest_path: metadata/REPLACE_WITH_SELECTED_MANIFEST.json
  feature_dir: data/features/REPLACE_WITH_ENCODER
  label_key: project_id
  patch_feature_dim: 1024
  max_patches: 4096
  patch_size: 256
  patch_stride: 256
  tissue_thumbnail_max_size: 2048
  tissue_saturation_threshold: 0.06
  tissue_value_threshold: 0.95
  load_coords: true

model:
  input_dim: 1024
  hidden_dim: 512
  num_heads: 8
  region_size: 64
  max_regions: 64
  retrieval_topk: 8
  latent_tokens: 16
  global_layers: 4
  dropout: 0.15
  instance_dropout: 0.15
  num_classes: 2
  use_positional_encoding: true
  use_multi_scale: true
  coarse_scale_factor: 4
  use_ssm: true
  ssm_d_state: 16
  ssm_d_conv: 4
  ssm_expand: 2
  use_moe: true
  num_experts: 8
  moe_topk: 2
  moe_aux_weight: 0.01
  use_residual_branch: true
  feature_augmentation: true
  aug_mask_ratio: 0.15
  aug_noise_std: 0.02
  use_graph_attention: true
  graph_k_neighbors: 6
  num_register_tokens: 4
  drop_path_rate: 0.15
  use_contrastive_head: true
  contrastive_proj_dim: 128
  use_attention_pooling: true
  attention_pool_queries: 4
  use_token_merging: true
  token_merge_ratio: 0.25
  use_qk_norm: true
  layer_scale_init: 0.0001

training:
  batch_size: 1
  epochs: 50
  learning_rate: 0.0002
  weight_decay: 0.01
  num_workers: 2
  device: cuda
  use_focal_loss: true
  focal_gamma: 2.0
  label_smoothing: 0.05
  warmup_epochs: 3
  min_lr: 0.000001
  gradient_clip_max_norm: 1.0
  use_amp: true
  use_ema: true
  ema_decay: 0.999
  gradient_accumulation_steps: 4
  use_gradtail: true
  gradtail_momentum: 0.9
  gradtail_min_weight: 0.5
  gradtail_max_weight: 3.0
  use_sam: false
  sam_rho: 0.05
  use_rdrop: false
  rdrop_alpha: 0.5
  use_supcon: false
  supcon_weight: 0.1
  supcon_temperature: 0.07
  use_swa: true
  swa_start_frac: 0.75
  tta_passes: 5
  use_asymmetric_loss: false
  asl_gamma_pos: 0.0
  asl_gamma_neg: 4.0
  asl_clip: 0.05
  use_mixup: false
  mixup_alpha: 0.3
  use_self_distillation: false
  distill_temperature: 4.0
  distill_alpha: 0.3
  use_gradient_centralization: false

