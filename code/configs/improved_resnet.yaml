dataset:
  dataset_root: data/raw_wsi
  manifest_path: metadata/REPLACE_WITH_SELECTED_MANIFEST.json
  feature_dir: data/features/REPLACE_WITH_ENCODER
  label_key: project_id
  patch_feature_dim: 1024
  max_patches: 4096
  patch_size: 256
  patch_stride: 256
  tissue_thumbnail_max_size: 2048
  tissue_saturation_threshold: 0.06
  tissue_value_threshold: 0.95
  load_coords: true

model:
  input_dim: 1024
  hidden_dim: 384
  num_heads: 6
  region_size: 64
  max_regions: 64
  retrieval_topk: 6
  latent_tokens: 8
  global_layers: 2
  dropout: 0.2
  num_classes: 2
  use_positional_encoding: true
  use_multi_scale: false
  coarse_scale_factor: 4
  use_ssm: false
  ssm_d_state: 16
  ssm_d_conv: 4
  ssm_expand: 2
  use_moe: false
  num_experts: 8
  moe_topk: 2
  moe_aux_weight: 0.01
  use_residual_branch: true
  feature_augmentation: true
  aug_mask_ratio: 0.15
  aug_noise_std: 0.01
  use_graph_attention: false
  graph_k_neighbors: 6
  num_register_tokens: 2
  drop_path_rate: 0.1
  use_contrastive_head: true
  contrastive_proj_dim: 128
  use_attention_pooling: true
  attention_pool_queries: 2
  use_token_merging: true
  token_merge_ratio: 0.3
  use_qk_norm: true
  layer_scale_init: 0.0001

training:
  batch_size: 1
  epochs: 80
  learning_rate: 0.00005
  weight_decay: 0.01
  num_workers: 2
  device: cuda
  use_focal_loss: true
  focal_gamma: 2.0
  label_smoothing: 0.05
  warmup_epochs: 10
  min_lr: 0.0000001
  gradient_clip_max_norm: 1.0
  use_amp: true
  use_ema: true
  ema_decay: 0.9995
  gradient_accumulation_steps: 8
  use_gradtail: true
  gradtail_momentum: 0.9
  gradtail_min_weight: 0.5
  gradtail_max_weight: 3.0
  use_sam: true
  sam_rho: 0.03
  use_rdrop: true
  rdrop_alpha: 0.3
  use_supcon: true
  supcon_weight: 0.05
  supcon_temperature: 0.1
  use_swa: true
  swa_start_frac: 0.7
  tta_passes: 5
  use_asymmetric_loss: false
  asl_gamma_pos: 0.0
  asl_gamma_neg: 4.0
  asl_clip: 0.05
  use_mixup: true
  mixup_alpha: 0.2
  use_self_distillation: true
  distill_temperature: 3.0
  distill_alpha: 0.2
  use_gradient_centralization: true

