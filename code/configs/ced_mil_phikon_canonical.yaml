dataset:
  dataset_root: data/raw_wsi
  manifest_path: metadata/REPLACE_WITH_SELECTED_MANIFEST.json
  feature_dir: data/features/REPLACE_WITH_ENCODER
  label_key: project_id
  patch_feature_dim: 1024
  max_patches: 4096
  patch_size: 256
  patch_stride: 256
  tissue_thumbnail_max_size: 2048
  tissue_saturation_threshold: 0.06
  tissue_value_threshold: 0.95
  load_coords: true

model:
  input_dim: 1024
  hidden_dim: 256
  num_heads: 8
  region_size: 64
  max_regions: 64
  retrieval_topk: 8
  latent_tokens: 16
  global_layers: 4
  dropout: 0.15
  num_classes: 2
  use_positional_encoding: false
  use_multi_scale: false
  coarse_scale_factor: 4
  use_ssm: false
  ssm_d_state: 16
  ssm_d_conv: 4
  ssm_expand: 2
  use_moe: false
  num_experts: 8
  moe_topk: 2
  moe_aux_weight: 0.01
  use_residual_branch: false
  feature_augmentation: false
  aug_mask_ratio: 0.15
  aug_noise_std: 0.02
  use_graph_attention: false
  graph_k_neighbors: 6
  num_register_tokens: 4
  drop_path_rate: 0.15
  use_contrastive_head: false
  contrastive_proj_dim: 128
  use_attention_pooling: false
  attention_pool_queries: 4
  use_token_merging: false
  token_merge_ratio: 0.25
  use_qk_norm: false
  layer_scale_init: 0.0001
  ced_attn_dim: 128
  ced_use_cf: true
  ced_lambda_sep: 0.05
  ced_lambda_align: 0.05
  ced_lambda_cf: 0.08
  ced_lambda_residual: 0.02
  ced_lambda_balance: 0.01
  ced_sep_margin: 1.0
  ced_cf_margin: 0.2

training:
  batch_size: 1
  epochs: 60
  learning_rate: 0.0003
  weight_decay: 0.01
  num_workers: 0
  device: cuda
  use_focal_loss: true
  focal_gamma: 2.0
  label_smoothing: 0.05
  warmup_epochs: 5
  min_lr: 0.000001
  gradient_clip_max_norm: 1.0
  use_amp: true
  use_ema: true
  ema_decay: 0.999
  gradient_accumulation_steps: 4
  use_gradtail: false
  gradtail_momentum: 0.9
  gradtail_min_weight: 0.5
  gradtail_max_weight: 3.0
  use_sam: false
  sam_rho: 0.05
  use_rdrop: false
  rdrop_alpha: 0.5
  use_supcon: false
  supcon_weight: 0.1
  supcon_temperature: 0.07
  use_swa: true
  swa_start_frac: 0.75
  tta_passes: 5
  use_asymmetric_loss: false
  asl_gamma_pos: 0.0
  asl_gamma_neg: 4.0
  asl_clip: 0.05
  use_mixup: false
  mixup_alpha: 0.3
  use_self_distillation: false
  distill_temperature: 4.0
  distill_alpha: 0.3
  use_gradient_centralization: false

