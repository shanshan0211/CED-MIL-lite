dataset:
  dataset_root: data/raw_wsi
  manifest_path: metadata/REPLACE_WITH_SELECTED_MANIFEST.json
  feature_dir: data/features/REPLACE_WITH_ENCODER
  label_key: project_code
  patch_feature_dim: 1024
  max_patches: 16384
  patch_size: 256
  patch_stride: 256
  tissue_thumbnail_max_size: 2048
  tissue_saturation_threshold: 0.06
  tissue_value_threshold: 0.95
  load_coords: true

model:
  input_dim: 1024
  hidden_dim: 256
  num_heads: 8
  region_size: 32
  max_regions: 128
  retrieval_topk: 4
  latent_tokens: 8
  global_layers: 3
  dropout: 0.15
  num_classes: 24
  use_positional_encoding: true
  use_multi_scale: true
  coarse_scale_factor: 4
  use_ssm: true
  ssm_d_state: 16
  ssm_d_conv: 4
  ssm_expand: 2
  use_moe: true
  num_experts: 8
  moe_topk: 2
  moe_aux_weight: 0.01
  use_residual_branch: true
  feature_augmentation: true
  aug_mask_ratio: 0.15
  aug_noise_std: 0.02
  # Beyond-SOTA
  use_graph_attention: true
  graph_k_neighbors: 8
  num_register_tokens: 4
  drop_path_rate: 0.1
  use_contrastive_head: true
  contrastive_proj_dim: 128
  use_attention_pooling: true
  attention_pool_queries: 4
  use_token_merging: true
  token_merge_ratio: 0.25
  use_qk_norm: true
  layer_scale_init: 0.0001

training:
  batch_size: 4
  epochs: 20
  learning_rate: 0.0003
  weight_decay: 0.05
  num_workers: 0
  device: cpu
  use_focal_loss: true
  focal_gamma: 2.0
  label_smoothing: 0.1
  warmup_epochs: 2
  min_lr: 0.000001
  gradient_clip_max_norm: 1.0
  use_amp: false
  use_ema: true
  ema_decay: 0.998
  gradient_accumulation_steps: 2
  use_gradtail: true
  gradtail_momentum: 0.9
  gradtail_min_weight: 0.5
  gradtail_max_weight: 3.0
  # Beyond-SOTA
  use_sam: true
  sam_rho: 0.05
  use_rdrop: true
  rdrop_alpha: 1.0
  use_supcon: true
  supcon_weight: 0.1
  supcon_temperature: 0.07
  use_swa: true
  swa_start_frac: 0.75
  tta_passes: 5
  use_asymmetric_loss: false
  asl_gamma_pos: 0.0
  asl_gamma_neg: 4.0
  asl_clip: 0.05
  use_mixup: true
  mixup_alpha: 0.4
  use_self_distillation: true
  distill_temperature: 4.0
  distill_alpha: 0.5
  use_gradient_centralization: true

