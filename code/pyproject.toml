[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ced-mil-evaluation"
version = "0.1.0"
description = "Reproducibility code for training-protocol and evaluation-robustness analyses in weakly supervised WSI classification"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "torchvision",
  "numpy",
  "scipy",
  "scikit-learn",
  "PyYAML>=6.0",
  "Pillow",
  "matplotlib",
  "requests",
  "openslide-python>=1.3",
  "huggingface-hub>=0.23",
  "safetensors>=0.4",
  "transformers>=4.40",
  "timm>=1.0.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

